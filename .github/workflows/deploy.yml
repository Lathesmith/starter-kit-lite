# Deploys on version tags (v1.2.3). Required repository secrets (Settings > Secrets > Actions):
#   CLOUDFLARE_API_TOKEN  - API token with "Workers Scripts: Edit", "D1: Edit", "Account Settings: Read"
#   CLOUDFLARE_ACCOUNT_ID - from the Cloudflare dashboard sidebar
# App secrets (RESEND_API_KEY, STRIPE_*) are NOT set here: set them once with `wrangler secret put`.
# See docs/deploy.md.
name: Deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
